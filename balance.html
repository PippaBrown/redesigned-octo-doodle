<style>
  :root{
    --bg:#0f0e13;
    --panel:#17151d;
    --panel-2:#1e1b26;
    --line:#2b2733;
    --text:#ece9f2;
    --muted:#8b859a;
    --lilac:#8fc9e8;
    --lilac-dim:#4a7690;
    --good:#8fd6a8;
    --bad:#ef5b5b;
    --teal:#4fc3bb;
    --teal-muted:#3d7d79;
    --teal-dark:#0d2b29;
    --grey-bar:#5a5568;
    --lightblue:#8fc9e8;
    --gold:#e0b84d;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    padding:28px 18px 60px;
  }
  .wrap{max-width:520px;margin:0 auto;position:relative;z-index:1;}
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--lilac-dim);
    margin-bottom:6px;
  }
  h1{
    font-size:28px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
    color:var(--lilac);
  }
  .section-heading{
    font-size:20px;
    font-weight:700;
    margin:0 0 12px;
    letter-spacing:-0.01em;
    color:var(--lilac);
  }
  .sub{color:var(--muted);font-size:14px;margin-top:6px;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
  }

  #logCard{touch-action:pan-y;}
  .day-viewport{
    overflow:hidden;
    position:relative;
    touch-action:pan-y;
    margin-bottom:12px;
  }
  .day-track{
    display:flex;
    width:300%;
    will-change:transform;
  }
  .day-panel{
    flex:0 0 33.3333%;
    width:33.3333%;
    box-sizing:border-box;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    height:26px;
    font-family:'Space Mono',monospace;
    font-size:14px;
    color:var(--muted);
    white-space:nowrap;
  }
  #dateInput{
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
    border:none;
  }
  .date-label{
    font-family:'Space Mono',monospace;
    font-size:14px;
    color:var(--text);
    letter-spacing:0.02em;
    cursor:pointer;
    white-space:nowrap;
  }

  .input-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:0;
  }
  .field label{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:9px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:7px;
    padding:6px 8px;
    color:var(--text);
    font-family:'Space Mono',monospace;
    font-size:13px;
  }
  .field input:focus{outline:none;border-color:var(--lilac);}

  .balance-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .balance-label{font-size:12px;color:var(--muted);font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:0.08em;}
  .balance-value{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;}
  .balance-value.deficit{color:var(--good);}
  .balance-value.surplus{color:var(--bad);}
  .balance-value.flat{color:var(--muted);}
  .balance-value.under{color:var(--lightblue);}
  .balance-value.in-range{color:var(--good);}
  .balance-value.over{color:var(--bad);}

  .stats-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:16px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 12px;
    text-align:center;
  }
  .stat-value{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;}
  .stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;}

  .chart-card{
    padding:20px 16px 12px;
  }
  .chart-title{
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:14px;
  }
  .chart-tabs{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:12px;
  }
  .tab-btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    padding:5px 14px;
    border-radius:8px;
    cursor:pointer;
  }
  .tab-btn.active{
    color:var(--lilac);
    border-color:var(--lilac-dim);
  }
  .legend{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:16px;
  }
  .legend-group{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .legend-title{
    font-family:'Space Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--lilac-dim);
    width:56px;
    flex-shrink:0;
  }
  .legend-items{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--muted);
  }
  .legend-item i{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
  svg{display:block;width:100%;height:auto;}
  .chart-viewport{overflow:hidden;position:relative;touch-action:pan-y;}
  .chart-track{display:flex;width:300%;will-change:transform;}
  .chart-panel{flex:0 0 33.3333%;width:33.3333%;box-sizing:border-box;padding:0 1px;}
  .grid-line{stroke:var(--line);stroke-width:1;}
  .bar-burned{fill:var(--grey-bar);}
  .bar-lightblue{fill:var(--lightblue);}
  .bar-green{fill:var(--good);}
  .bar-red{fill:var(--bad);}
  .axis-label{
    fill:var(--muted);
    font-family:'Space Mono',monospace;
    font-size:14px;
    opacity:0.7;
  }
  .day-label{
    fill:var(--muted);
    font-family:'Space Mono',monospace;
    font-size:15px;
  }
  .day-group{cursor:pointer;}
  .day-label-selected{
    fill:var(--lilac);
  }
  .bar-selected{
    stroke:var(--lilac);
    stroke-width:1.4;
  }
  .empty-note{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:20px 0;
  }

  .week-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:#17151d;
    padding:8px 12px;
    border-radius:8px;
    font-family:'Space Mono',monospace;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin:14px 0 8px;
  }
  .week-header.under{background:var(--lightblue);}
  .week-header.in-range{background:var(--good);}
  .week-header.over{background:var(--bad);}
  .week-header:first-child{margin-top:0;}

  .log-list{display:flex;flex-direction:column;gap:8px;}
  .log-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    background:var(--panel-2);
    border-radius:10px;
    font-family:'Space Mono',monospace;
    font-size:12px;
  }
  .log-date{color:var(--muted);}
  .log-nums{color:var(--text);}
  .log-bal{font-weight:700;}

  footer{
    text-align:center;
    color:var(--lilac-dim);
    font-family:'Space Mono',monospace;
    font-size:11px;
    margin-top:30px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">calories in / calories out</div>
    <h1>balance</h1>
    <div class="sub">one day at a time</div>
  </header>

  <div class="card chart-card">
    <div class="chart-tabs" id="chartTabs">
      <button class="tab-btn active" data-tab="week" type="button">week</button>
      <button class="tab-btn" data-tab="month" type="button">month</button>
      <button class="tab-btn" data-tab="year" type="button">1/2 year</button>
    </div>
    <div class="chart-title" id="chartWeekLabel" style="text-align:center;">this week</div>
    <div class="legend">
      <div class="legend-group">
        <span class="legend-title">cals out</span>
        <div class="legend-items">
          <span class="legend-item"><i style="background:var(--grey-bar);"></i></span>
        </div>
      </div>
      <div class="legend-group">
        <span class="legend-title">cals in</span>
        <div class="legend-items">
          <span class="legend-item"><i style="background:var(--lightblue);"></i>under</span>
          <span class="legend-item"><i style="background:var(--good);"></i>in range</span>
          <span class="legend-item"><i style="background:var(--bad);"></i>over</span>
        </div>
      </div>
    </div>
    <div class="chart-viewport" id="chartViewport">
      <div class="chart-track" id="chartTrack">
        <div class="chart-panel" id="panelPrev"></div>
        <div class="chart-panel" id="panelCurrent"></div>
        <div class="chart-panel" id="panelNext"></div>
      </div>
    </div>
  </div>

  <h2 class="section-heading">log a day</h2>
  <div class="card" id="logCard">
    <div class="day-viewport" id="dayViewport">
      <div class="day-track" id="dayTrack">
        <div class="day-panel" id="dayPanelPrev"></div>
        <div class="day-panel" id="dayPanelCurrent">
          <span class="date-label" id="dateLabel"></span>
        </div>
        <div class="day-panel" id="dayPanelNext"></div>
      </div>
    </div>
    <input type="date" id="dateInput" class="hidden-date-input">
    <div class="input-grid">
      <div class="field">
        <label>eaten (kcal)</label>
        <input type="number" id="eatenInput" inputmode="numeric" placeholder="0">
      </div>
      <div class="field">
        <label>burned (kcal)</label>
        <input type="number" id="burnedInput" inputmode="numeric" placeholder="0">
      </div>
    </div>
  </div>

</div>

<script>
const STORAGE_KEY = 'balance-tracker-entries';

function loadEntries(){
  try{
    if(!localStorage.getItem('balance-tracker-fresh-start-v1')){
      localStorage.removeItem(STORAGE_KEY);
      localStorage.setItem('balance-tracker-fresh-start-v1', '1');
      return {};
    }
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  }
  catch(e){ return {}; }
}
function saveEntries(entries){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}
function formatLocalDate(d){
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}
function todayStr(){
  return formatLocalDate(new Date());
}
function shiftDate(dateStr, days){
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  return formatLocalDate(dt);
}
function fmtDayLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-GB', {weekday:'short'}).slice(0,2);
}

let entries = loadEntries();
let currentDate = todayStr();

const dateInput = document.getElementById('dateInput');
const eatenInput = document.getElementById('eatenInput');
const burnedInput = document.getElementById('burnedInput');

function formatDayDisplay(dateStr){
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).toLowerCase().replace(',', '');
}

function renderDayForm(){
  dateInput.value = currentDate;
  document.getElementById('dateLabel').textContent = formatDayDisplay(currentDate);
  document.getElementById('dayPanelPrev').textContent = formatDayDisplay(shiftDate(currentDate, -1));
  document.getElementById('dayPanelNext').textContent = formatDayDisplay(shiftDate(currentDate, 1));
  const e = entries[currentDate] || {};
  eatenInput.value = e.eaten ?? '';
  burnedInput.value = e.burned ?? '';
  const vw = dayViewport.clientWidth;
  setDayTrackX(-vw, false);
  renderChart();
}

function persistCurrentInputs(){
  const eaten = eatenInput.value === '' ? null : parseFloat(eatenInput.value);
  const burned = burnedInput.value === '' ? null : parseFloat(burnedInput.value);
  if(eaten === null && burned === null){
    delete entries[currentDate];
  } else {
    entries[currentDate] = { eaten: eaten ?? 0, burned: burned ?? 0 };
  }
  saveEntries(entries);
  renderChart();
}

eatenInput.addEventListener('input', () => { persistCurrentInputs(); });
burnedInput.addEventListener('input', () => { persistCurrentInputs(); });

dateInput.addEventListener('change', () => {
  currentDate = dateInput.value || todayStr();
  renderDayForm();
});

document.getElementById('dateLabel').addEventListener('click', () => {
  if(dateInput.showPicker){
    dateInput.showPicker();
  } else {
    dateInput.focus();
    dateInput.click();
  }
});

const dayViewport = document.getElementById('dayViewport');
const dayTrack = document.getElementById('dayTrack');

function setDayTrackX(px, animate){
  dayTrack.style.transition = animate ? 'transform 0.28s cubic-bezier(0.22,0.61,0.36,1)' : 'none';
  dayTrack.style.transform = `translateX(${px}px)`;
}

function goToDay(direction, animate){
  const vw = dayViewport.clientWidth;
  const targetX = direction === 1 ? -2 * vw : 0;
  if(!animate){
    currentDate = shiftDate(currentDate, direction);
    renderDayForm();
    return;
  }
  setDayTrackX(targetX, true);
  const onEnd = () => {
    dayTrack.removeEventListener('transitionend', onEnd);
    currentDate = shiftDate(currentDate, direction);
    renderDayForm();
  };
  dayTrack.addEventListener('transitionend', onEnd);
}

function snapDayBack(){
  setDayTrackX(-dayViewport.clientWidth, true);
}

(function setupDaySwipe(){
  let startX = 0, startY = 0, dragging = false, dx = 0, vw = 0, axisLocked = null;
  const swipeTarget = document.getElementById('logCard');

  swipeTarget.addEventListener('touchstart', (e) => {
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dx = 0;
    axisLocked = null;
    vw = dayViewport.clientWidth;
    dragging = true;
  }, { passive: true });

  swipeTarget.addEventListener('touchmove', (e) => {
    if(!dragging) return;
    const curX = e.touches[0].clientX;
    const curY = e.touches[0].clientY;
    const moveX = curX - startX;
    const moveY = curY - startY;
    if(axisLocked === null && (Math.abs(moveX) > 6 || Math.abs(moveY) > 6)){
      axisLocked = Math.abs(moveX) > Math.abs(moveY) ? 'x' : 'y';
    }
    if(axisLocked === 'x'){
      dx = moveX;
      setDayTrackX(-vw + dx, false);
    }
  }, { passive: true });

  swipeTarget.addEventListener('touchend', () => {
    if(!dragging) return;
    dragging = false;
    if(axisLocked !== 'x'){ return; }
    const threshold = Math.min(60, vw * 0.16);
    if(dx <= -threshold){
      goToDay(1, true);
    } else if(dx >= threshold){
      goToDay(-1, true);
    } else {
      snapDayBack();
    }
    dx = 0;
  }, { passive: true });
})();

window.addEventListener('resize', () => setDayTrackX(-dayViewport.clientWidth, false));

function eatenBarClass(eaten, burned){
  const diff = eaten - burned;
  if(diff <= -50) return 'bar-lightblue';
  if(diff >= 50) return 'bar-red';
  return 'bar-green';
}

function getSunday(dateStr){
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() - dt.getDay());
  return formatLocalDate(dt);
}

function shiftMonthKey(ms, n){
  const [y, m] = ms.split('-').map(Number);
  const total = (y * 12 + (m - 1)) + n;
  const ny = Math.floor(total / 12);
  const nm = (total % 12 + 12) % 12 + 1;
  return `${ny}-${String(nm).padStart(2, '0')}`;
}

function monthShortLabel(ms){
  const [y, m] = ms.split('-').map(Number);
  const dt = new Date(y, m - 1, 1);
  return dt.toLocaleDateString('en-GB', { month: 'short' }).toLowerCase();
}

let chartTab = 'week';
let chartWeekStart = getSunday(todayStr());
let chartMonthWindowStart = shiftDate(getSunday(todayStr()), -21);
let chartYearWindowStart = shiftMonthKey(todayStr().slice(0, 7), -5);

function currentWindowStart(){
  if(chartTab === 'week') return chartWeekStart;
  if(chartTab === 'month') return chartMonthWindowStart;
  return chartYearWindowStart;
}
function setWindowStart(v){
  if(chartTab === 'week') chartWeekStart = v;
  else if(chartTab === 'month') chartMonthWindowStart = v;
  else chartYearWindowStart = v;
}
function shiftWindow(ws, direction){
  if(chartTab === 'year') return shiftMonthKey(ws, 6 * direction);
  const days = chartTab === 'week' ? 7 : 28;
  return shiftDate(ws, days * direction);
}

function weekLabelFor(weekStart){
  const thisSunday = getSunday(todayStr());
  const lastSunday = shiftDate(thisSunday, -7);
  const dateRange = `${fmtDate(weekStart)} – ${fmtDate(shiftDate(weekStart, 6))}`;
  if(weekStart === thisSunday) return `This week · ${dateRange}`;
  if(weekStart === lastSunday) return `Last week · ${dateRange}`;
  return dateRange;
}
function monthLabelFor(windowStart){
  return `${fmtDate(windowStart)} – ${fmtDate(shiftDate(windowStart, 27))}`;
}
function yearLabelFor(windowStart){
  const end = shiftMonthKey(windowStart, 5);
  const sy = windowStart.slice(0, 4), ey = end.slice(0, 4);
  if(sy === ey) return `${monthShortLabel(windowStart)} – ${monthShortLabel(end)} ${ey}`;
  return `${monthShortLabel(windowStart)} ${sy} – ${monthShortLabel(end)} ${ey}`;
}
function labelFor(tab, windowStart){
  if(tab === 'week') return weekLabelFor(windowStart);
  if(tab === 'month') return monthLabelFor(windowStart);
  return yearLabelFor(windowStart);
}

function weekGroups(weekStart){
  const days = [];
  for(let i = 0; i < 7; i++) days.push(shiftDate(weekStart, i));
  return days.map(d => {
    const e = entries[d] || null;
    return {
      label: fmtDayLabel(d).toLowerCase(),
      eaten: e ? e.eaten : null,
      burned: e ? e.burned : null,
      isSelected: d === currentDate,
      key: d
    };
  });
}

function monthGroups(windowStart){
  const weeks = [];
  for(let i = 0; i < 4; i++) weeks.push(shiftDate(windowStart, i * 7));
  const currentWeekStart = getSunday(currentDate);
  return weeks.map(ws => {
    const days = [];
    for(let i = 0; i < 7; i++) days.push(shiftDate(ws, i));
    const known = days.map(d => entries[d]).filter(Boolean);
    const avgEaten = known.length ? known.reduce((s, e) => s + e.eaten, 0) / known.length : null;
    const avgBurned = known.length ? known.reduce((s, e) => s + e.burned, 0) / known.length : null;
    return {
      label: fmtDate(ws).toLowerCase(),
      eaten: avgEaten,
      burned: avgBurned,
      isSelected: ws === currentWeekStart,
      key: ws
    };
  });
}

function yearGroups(windowStart){
  const months = [];
  for(let i = 0; i < 6; i++) months.push(shiftMonthKey(windowStart, i));
  const currentMonthKey = currentDate.slice(0, 7);
  return months.map(ms => {
    const [y, m] = ms.split('-').map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const known = [];
    for(let d = 1; d <= daysInMonth; d++){
      const ds = `${ms}-${String(d).padStart(2, '0')}`;
      if(entries[ds]) known.push(entries[ds]);
    }
    const avgEaten = known.length ? known.reduce((s, e) => s + e.eaten, 0) / known.length : null;
    const avgBurned = known.length ? known.reduce((s, e) => s + e.burned, 0) / known.length : null;
    return {
      label: monthShortLabel(ms),
      eaten: avgEaten,
      burned: avgBurned,
      isSelected: ms === currentMonthKey,
      key: ms
    };
  });
}

function renderGroupsSVG(groups){
  const known = groups.filter(g => g.eaten !== null);
  const maxVal = known.length === 0
    ? 2000
    : Math.max(1800, ...known.map(g => Math.max(g.eaten, g.burned)));
  const width = 500, height = 430;
  const padTop = 20, padBottom = 32, padLeft = 34, padRight = 10;
  const n = groups.length;
  const groupGap = n >= 7 ? 10 : 16;
  const barGapInner = 1.8;
  const barWidthFraction = n >= 7 ? 0.2754 : 0.32;
  const groupWidth = (width - padLeft - padRight - groupGap*(n-1)) / n;
  const barWidth = groupWidth * barWidthFraction;
  const pairWidth = barWidth * 2 + barGapInner;
  const pairOffset = (groupWidth - pairWidth) / 2;
  const chartHeight = height - padTop - padBottom;
  const scale = chartHeight / maxVal;
  const baseline = height - padBottom;

  let bars = '';
  let gridLines = '';
  let axisLabels = '';
  for(let v = 1000; v <= maxVal; v += 1000){
    const y = baseline - v * scale;
    gridLines += `<line class="grid-line" x1="${padLeft}" y1="${y}" x2="${width-padRight}" y2="${y}"></line>`;
    axisLabels += `<text class="axis-label" x="${padLeft - 6}" y="${y + 3}" text-anchor="end">${v/1000}k</text>`;
  }

  groups.forEach((g, i) => {
    const gx = padLeft + i * (groupWidth + groupGap);
    let groupMarkup = '';
    if(g.eaten !== null){
      const burnedH = Math.max(g.burned * scale, 1.5);
      const eatenH = Math.max(g.eaten * scale, 1.5);
      const eatenCls = eatenBarClass(g.eaten, g.burned);
      const eatenX = gx + pairOffset;
      const burnedX = eatenX + barWidth + barGapInner;
      const highlightCls = g.isSelected ? ' bar-selected' : '';
      groupMarkup += `<rect class="bar-burned${highlightCls}" x="${burnedX}" y="${baseline - burnedH}" width="${barWidth}" height="${burnedH}" rx="2"></rect>`;
      groupMarkup += `<rect class="${eatenCls}${highlightCls}" x="${eatenX}" y="${baseline - eatenH}" width="${barWidth}" height="${eatenH}" rx="2"></rect>`;
    }
    const labelCls = g.isSelected ? 'day-label day-label-selected' : 'day-label';
    groupMarkup += `<text class="${labelCls}" x="${gx + groupWidth/2}" y="${height - 4}" text-anchor="middle">${g.label}</text>`;
    bars += `<g class="day-group" data-key="${g.key}">
      <rect x="${gx}" y="${padTop}" width="${groupWidth}" height="${height - padTop}" fill="transparent"></rect>
      ${groupMarkup}
    </g>`;
  });

  return `
  <svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">
    ${gridLines}
    ${axisLabels}
    ${bars}
  </svg>`;
}

function buildPanel(tab, windowStart){
  if(tab === 'week') return renderGroupsSVG(weekGroups(windowStart));
  if(tab === 'month') return renderGroupsSVG(monthGroups(windowStart));
  return renderGroupsSVG(yearGroups(windowStart));
}

const chartViewport = document.getElementById('chartViewport');
const chartTrack = document.getElementById('chartTrack');
const panelPrev = document.getElementById('panelPrev');
const panelCurrent = document.getElementById('panelCurrent');
const panelNext = document.getElementById('panelNext');

function updateTabUI(){
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-tab') === chartTab);
  });
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.getAttribute('data-tab');
    if(tab === chartTab) return;
    chartTab = tab;
    if(tab === 'week') chartWeekStart = getSunday(todayStr());
    if(tab === 'month') chartMonthWindowStart = shiftDate(getSunday(todayStr()), -21);
    if(tab === 'year') chartYearWindowStart = shiftMonthKey(todayStr().slice(0, 7), -5);
    updateTabUI();
    renderChart();
  });
});

chartTrack.addEventListener('click', (e) => {
  const target = e.target.closest('[data-key]');
  if(!target) return;
  const key = target.getAttribute('data-key');
  if(!key) return;
  if(chartTab === 'week'){
    if(key !== currentDate){
      currentDate = key;
      renderDayForm();
    }
  } else if(chartTab === 'month'){
    chartTab = 'week';
    chartWeekStart = key;
    updateTabUI();
    renderChart();
  } else if(chartTab === 'year'){
    chartTab = 'month';
    chartMonthWindowStart = getSunday(`${key}-01`);
    updateTabUI();
    renderChart();
  }
});

function setTrackX(px, animate){
  chartTrack.style.transition = animate ? 'transform 0.28s cubic-bezier(0.22,0.61,0.36,1)' : 'none';
  chartTrack.style.transform = `translateX(${px}px)`;
}

function renderChart(){
  const ws = currentWindowStart();
  document.getElementById('chartWeekLabel').textContent = labelFor(chartTab, ws);
  panelPrev.innerHTML = buildPanel(chartTab, shiftWindow(ws, -1));
  panelCurrent.innerHTML = buildPanel(chartTab, ws);
  panelNext.innerHTML = buildPanel(chartTab, shiftWindow(ws, 1));
  const vw = chartViewport.clientWidth;
  setTrackX(-vw, false);
}

function goToWeek(direction, animate){
  const vw = chartViewport.clientWidth;
  const targetX = direction === 1 ? -2 * vw : 0;
  if(!animate){
    setWindowStart(shiftWindow(currentWindowStart(), direction));
    renderChart();
    return;
  }
  setTrackX(targetX, true);
  const onEnd = () => {
    chartTrack.removeEventListener('transitionend', onEnd);
    setWindowStart(shiftWindow(currentWindowStart(), direction));
    renderChart();
  };
  chartTrack.addEventListener('transitionend', onEnd);
}

function snapBack(){
  const vw = chartViewport.clientWidth;
  setTrackX(-vw, true);
}

(function setupSwipe(){
  let startX = 0, startY = 0, dragging = false, dx = 0, vw = 0, axisLocked = null;

  chartViewport.addEventListener('touchstart', (e) => {
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dx = 0;
    axisLocked = null;
    vw = chartViewport.clientWidth;
    dragging = true;
  }, { passive: true });

  chartViewport.addEventListener('touchmove', (e) => {
    if(!dragging) return;
    const curX = e.touches[0].clientX;
    const curY = e.touches[0].clientY;
    const moveX = curX - startX;
    const moveY = curY - startY;
    if(axisLocked === null && (Math.abs(moveX) > 6 || Math.abs(moveY) > 6)){
      axisLocked = Math.abs(moveX) > Math.abs(moveY) ? 'x' : 'y';
    }
    if(axisLocked === 'x'){
      dx = moveX;
      setTrackX(-vw + dx, false);
    }
  }, { passive: true });

  chartViewport.addEventListener('touchend', () => {
    if(!dragging) return;
    dragging = false;
    if(axisLocked !== 'x'){ return; }
    const threshold = Math.min(70, vw * 0.16);
    if(dx <= -threshold){
      goToWeek(1, true);
    } else if(dx >= threshold){
      goToWeek(-1, true);
    } else {
      snapBack();
    }
    dx = 0;
  }, { passive: true });
})();

window.addEventListener('resize', () => setTrackX(-chartViewport.clientWidth, false));

function fmtDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
}

renderDayForm();
</script>
